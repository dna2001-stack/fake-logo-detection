{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Fake Logo Detection</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>

<div class="container">

    <!-- Top bar -->
    <div class="top-bar">
        <div>
            Logged in as <strong>{{ request.user.username }}</strong>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="theme-toggle" onclick="toggleTheme()">🌗 Theme</button>

            <form method="post" action="/logout/">
                {% csrf_token %}
                <button type="submit" class="logout-btn">⎋ Logout</button>
            </form>
        </div>
    </div>

    <h2>Fake Logo Detection</h2>

    <!-- Upload form -->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="logo" required>
        <button type="submit">Detect Logo</button>
    </form>

    <!-- Image preview -->
    {% if image_url %}
        <div class="image-preview">
            <p><strong>Uploaded Image</strong></p>
            <img src="{{ image_url }}" alt="Uploaded Logo">
        </div>
    {% endif %}

    <!-- Result -->
    {% if result %}
        {% if "REAL" in result %}
            <div class="result-box result-real">{{ result }}</div>
        {% else %}
            <div class="result-box result-fake">{{ result }}</div>
        {% endif %}
    {% endif %}

</div>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}

// Persist theme
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>

</body>
</html>
